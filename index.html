<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="CUT30: diario nutrizionale, allenamenti, calendario e progressi, sincronizzabili con Google Sheets." />
  <title>CUT30 — Fitness dashboard</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/cut30.svg" />
  <link rel="stylesheet" href="./styles.css?v=1.0.2" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigazione principale">
      <div class="brand"><div class="brand-icon">C<span>30</span></div><div><strong>CUT30</strong><small>PERSONAL FITNESS</small></div></div>
      <p class="side-label">WORKSPACE</p>
      <nav id="side-nav"></nav>
      <div class="side-bottom"><div class="online-dot"></div><span id="side-sync-text">Archivio locale</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">YOUR TRAINING SPACE</div><h1 id="page-title">Dashboard</h1><div id="page-subtitle" class="subtitle">Il tuo andamento in un unico posto</div></div>
        <div class="top-actions"><span class="today-chip" id="date-chip"></span><button class="btn btn-quiet" type="button" data-nav="settings" title="Apri impostazioni" aria-label="Apri impostazioni">⚙</button><button class="btn btn-quiet" id="sync-top" title="Sincronizza con Google Sheets">↻ <span class="desktop-only">Sincronizza</span></button></div>
      </header>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="app" class="content"></div>
    </main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navigazione mobile"></nav>
  </div>
  <div id="modal-layer" class="modal-layer hidden" aria-hidden="true"></div>
<script src="./app.js?v=1.0.3" defer></script>
</body>
</html>
